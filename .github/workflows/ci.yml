# 持续集成：构建 + 全部测试 + 发布产物校验
#
# 设计要点：
# - 只跑与开发机一致的环境（ubuntu + 当前本地 Node 版本），不做多版本/多系统矩阵。
#   项目不承诺向下兼容更低的 Node，版本基准以 .node-version 与 package.json 的 engines 为准。
# - permissions 收窄到 contents: read，遵循最小权限原则
# - 所有第三方 action 固定到完整 commit SHA，杜绝 tag 被移动导致的供应链攻击
# - lint 不在 CI 中执行，由本地 npm run lint 负责（见 AGENTS.md 的验证清单）
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 单一版本，与 .node-version 保持一致。改这里时同步改 .node-version 与 engines.node。
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build

      - name: Smoke test (无需真实 XXL-JOB)
        run: npm run smoke

      # 每个 test:* 脚本都必须在这里显式列一遍：只跑某个聚合脚本不会自动发现新脚本。
      # 历史上 test:registry 与 test:cli 就因此从未在 CI 执行过。
      - name: Config unit tests (纯函数，无外部依赖)
        run: npm run test:config

      - name: Registry unit tests (注入假客户端，无网络)
        run: npm run test:registry

      - name: CLI (init 子命令) unit tests
        run: npm run test:cli

      - name: Regression tests (已修复脆弱点)
        run: npm run test:regression

      - name: Integration test (自带 Mock Admin)
        run: npm run test:integration

  package-check:
    name: 发布产物校验
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # 打包产物与发布走同一份白名单校验：CI 抓不到的问题，发布时也不该出现。
      # 这里只校验文件清单（不校验版本/tag，那些由 release 触发时的 publish.yml 负责）。
      - name: Verify package contents against release whitelist
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pack"
          npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}/pack" > "${RUNNER_TEMP}/pack.json"
          TARBALL=$(node -e 'const p=require(process.env.RUNNER_TEMP+"/pack.json");if(p.length!==1)process.exit(1);console.log(require("node:path").join(process.env.RUNNER_TEMP,"pack",p[0].filename))')
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { assertPackageEntries } from "./scripts/release-policy.mjs";
            const entries = execFileSync("tar", ["-tzf", process.argv[1]], { encoding: "utf8" }).trim().split("\\n");
            assertPackageEntries(entries);
            console.log("发布白名单校验通过，文件数:", entries.length);
          ' "$TARBALL"

      # 确保测试代码不会被意外打进 npm 包（files 字段应排除 dist/tests）
      - name: Verify package contents exclude tests
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const leaked = files.filter(p => p.startsWith("dist/tests"));
            console.log("打包文件数:", files.length);
            if (leaked.length > 0) {
              console.error("错误: 测试文件被打进 npm 包:", leaked);
              process.exit(1);
            }
            const required = ["dist/src/server.js", "package.json", "LICENSE"];
            const missing = required.filter(p => !files.includes(p));
            if (missing.length > 0) {
              console.error("错误: 包内缺少必需文件:", missing);
              process.exit(1);
            }
            console.log("发布产物体检通过");
          '
