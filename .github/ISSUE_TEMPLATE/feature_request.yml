---
name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 issue。请重点说明「要解决什么问题」，而非直接指定实现方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么限制或不便？为什么现有工具无法满足？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望的用法是怎样的？如果是新增 MCP 工具，请描述工具名、入参与返回。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我可以尝试实现这个功能
          required: false
